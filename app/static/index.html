<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股量化回测平台</title>
  <link rel="stylesheet" href="/static/css/style.css?v=20260721f">
  <script src="/static/js/vendor/echarts.min.js?v=20260722a"></script>
  <link rel="stylesheet" href="/static/css/feedback.css?v=20260713">
  <link rel="stylesheet" href="/static/css/shell.css?v=20260714">
</head>
<body>

<header>
  <h1>📈 A股量化回测平台</h1>
  <nav class="header-nav">
    <button class="nav-btn active" id="navSignal" onclick="switchMode('signal')">单股策略</button>
    <button class="nav-btn" id="navPortfolio" onclick="switchMode('portfolio')">选股策略</button>
    <a class="nav-btn" href="/cloudmap" style="text-decoration:none;display:inline-flex;align-items:center;">大盘云图</a>
    <a class="nav-btn" href="/paper_trading" style="text-decoration:none;display:inline-flex;align-items:center;">实盘观察</a>
    <a class="nav-btn" href="/ai_hotsector" style="text-decoration:none;display:inline-flex;align-items:center;">AI热门板块</a>
    <a class="nav-btn" href="/daily_review" style="text-decoration:none;display:inline-flex;align-items:center;">每日复盘</a>
    <a class="nav-btn" href="/watchlist" style="text-decoration:none;display:inline-flex;align-items:center;">自选盯盘</a>  </nav>
</header>

<main>

  <!-- ══════════════════════════════════════════════════════
       单股策略面板
  ══════════════════════════════════════════════════════ -->
  <div id="signalMode">
    <div class="panel">
      <div class="panel-title">单股回测设置</div>

      <div class="form-row">
        <div class="form-group">
          <label>股票代码</label>
          <div class="inline-group">
            <input type="text" id="stockCode" placeholder="如 000001" maxlength="8" style="width:110px">
            <button class="btn btn-outline" id="loadKlineBtn">查看K线</button>
          </div>
          <div class="stock-tag" id="stockTag"></div>
        </div>
        <div class="form-group">
          <label>开始日期</label>
          <input type="date" id="startDate" value="2022-01-01">
        </div>
        <div class="form-group">
          <label>结束日期</label>
          <input type="date" id="endDate">
        </div>
        <div class="form-group">
          <label>初始资金（元）</label>
          <input type="number" id="capital" value="100000" min="10000" step="10000" style="width:140px">
        </div>
        <div class="form-group">
          <label>复权方式</label>
          <select id="adjust">
            <option value="qfq">前复权</option>
            <option value="hfq">后复权</option>
            <option value="">不复权</option>
          </select>
        </div>
        <div class="form-group">
          <label>滑点（%）</label>
          <input type="number" id="slippage" value="0.01" min="0" max="1" step="0.01" style="width:90px">
        </div>
        <div class="form-group">
          <label>止损（%，0=关闭）</label>
          <input type="number" id="stopLoss" value="0" min="0" max="50" step="1" style="width:90px">
        </div>
        <div class="form-group">
          <label>止盈（%，0=关闭）</label>
          <input type="number" id="takeProfit" value="0" min="0" max="200" step="1" style="width:90px">
        </div>
      </div>

      <hr class="divider">
      <div class="strategy-section-label">可用技术策略（点击添加）</div>
      <div class="strategy-grid" id="signalStrategyGrid"></div>

      <div class="strategy-section-label">已选策略实例</div>
      <div class="instances-list" id="instancesList">
        <div class="empty-hint" id="emptyHint">请从上方选择策略并添加</div>
      </div>

      <div id="settingsError"></div>
      <button class="btn btn-accent btn-run" id="runBtn" disabled>开始单股回测</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       选股型策略面板
  ══════════════════════════════════════════════════════ -->
  <div id="portfolioMode" style="display:none">
    <div class="panel">
      <div class="panel-title">选股策略回测设置
        <span class="tip-badge" id="pTipBadge">无偏历史回测：按每个调仓日真实市值选股，需下载候选股行情，约 2~5 分钟</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>开始日期</label>
          <input type="date" id="pStartDate" value="2022-01-01">
        </div>
        <div class="form-group">
          <label>结束日期</label>
          <input type="date" id="pEndDate">
        </div>
        <div class="form-group">
          <label>初始资金（元）</label>
          <input type="number" id="pCapital" value="100000" min="10000" step="10000" style="width:140px">
        </div>
        <div class="form-group">
          <label>基准指数</label>
          <select id="pBenchmark" style="width:130px">
            <option value="">策略默认</option>
            <option value="000300">沪深300</option>
            <option value="000905">中证500</option>
            <option value="000852">中证1000</option>
            <option value="000016">上证50</option>
            <option value="399006">创业板指</option>
            <option value="399303">国证2000</option>
          </select>
        </div>
      </div>

      <hr class="divider">
      <div class="strategy-section-label">选股策略（点击选择）</div>
      <div class="strategy-grid" id="portfolioStrategyGrid"></div>

      <!-- 策略详细说明（选中后渲染） -->
      <div id="portfolioStrategyDetail"></div>

      <div id="portfolioSelectedArea" style="display:none">
        <div class="strategy-section-label">策略参数</div>
        <div id="portfolioInstanceCard"></div>

        <!-- 回测口径（无偏 / 板块 / ST） -->
        <div class="strategy-section-label" style="margin-top:14px">回测口径</div>
        <div class="method-controls">
          <label class="method-check">
            <input type="checkbox" id="pPointInTime" checked>
            <span>无偏历史回测 <em>（推荐）</em></span>
            <small>用每个调仓日「真实在市值区间」的股票池，消除幸存者偏差（不会漏掉当年小、现在涨大的赢家）。取消则用<strong>今日快照池</strong>——更快，但会系统性低估收益。</small>
          </label>

          <div class="method-boards">
            <span class="method-boards-label">允许板块</span>
            <label><input type="checkbox" class="pBoard" value="main" checked> 主板</label>
            <label><input type="checkbox" class="pBoard" value="gem"> 创业板</label>
            <label><input type="checkbox" class="pBoard" value="star"> 科创板</label>
            <label><input type="checkbox" class="pBoard" value="bj"> 北交所</label>
            <small class="method-boards-hint">实盘 9 万本金通常只开得了主板；创业板/科创板需 50 万+2 年经验。</small>
          </div>

          <label class="method-check">
            <input type="checkbox" id="pExcludeSt" checked>
            <span>剔除 ST 股</span>
            <small>排除风险警示股。<em>局限：仅按当前 ST 状态近似，无历史 ST 数据。</em></small>
          </label>
        </div>
      </div>

      <div id="portfolioError"></div>
      <button class="btn btn-accent btn-run" id="runPortfolioBtn" disabled>开始选股回测</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       K线图（单股模式使用）
  ══════════════════════════════════════════════════════ -->
  <div class="panel" id="klinePanel" style="display:none">
    <div class="panel-title" id="klinePanelTitle">K线图</div>
    <div class="chart-wrap" id="klineChart"></div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       回测结果（两种模式共用）
  ══════════════════════════════════════════════════════ -->
  <div class="panel" id="resultsPanel" style="display:none">
    <div class="panel-title">回测结果 <span id="resultSubtitle"></span></div>
    <div class="metrics-scroll" id="metricsWrap"></div>
    <div class="section-title">净值曲线</div>
    <div class="chart-wrap-sm" id="equityChart"></div>
    <div class="section-title">交易记录</div>
    <div id="tradesWrap"></div>
  </div>

</main>

<div id="loading">
  <div class="loader-box">
    <div class="spinner"></div>
    <p id="loadingMsg">加载中…</p>
    <div id="progressBar" style="display:none">
      <div class="pb-track">
        <div class="pb-fill"></div>
      </div>
      <span class="pb-label">0%</span>
    </div>
  </div>
</div>

<footer class="site-footer">
  💡 需要定制策略 / 接入实盘？只提供代码，服务器需自行购买 · 第一单免费（目前限时全免）·

</footer>

<script src="/static/js/app.js?v=20260721f"></script>
<script src="/static/js/feedback.js?v=20260713"></script>
<script src="/static/js/util.js?v=20260721e"></script>
<script src="/static/js/auth.js?v=20260721e"></script>
<script src="/static/js/shell.js?v=20260721h"></script>
</body>
</html>
