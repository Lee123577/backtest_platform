<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>%F0%9F%95%90</text></svg>">
  <title>仪表盘 - 收盘 shoupan</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/feedback.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="spx-shell">

<header>
  <h1>📈 A股量化回测平台</h1>
  <nav class="header-nav">
    <a class="nav-btn" href="/">单股策略</a>
    <a class="nav-btn" href="/daily_review">每日复盘</a>
  </nav>
</header>

<main>
  <!-- 欢迎条 -->
  <div class="dash-hero" id="dashHero">
    <div class="dash-hero-text">
      <div class="dash-hello" id="dashHello">欢迎</div>
      <div class="dash-sub" id="dashHeroSub">加载中…</div>
      <div class="dash-hero-stats" id="dashHeroStats" hidden></div>
    </div>
    <div id="dashHeroAction"></div>
  </div>

  <!-- 状态卡片 -->
  <div class="dash-grid">
    <div class="dash-card" id="cardMember">
      <div class="dash-card-head"><span class="dash-ico">💎</span> 我的会员</div>
      <div class="dash-card-body" id="memberBody"><div class="dash-loading">加载中…</div></div>
    </div>

    <div class="dash-card" id="cardReview">
      <div class="dash-card-head"><span class="dash-ico">📈</span> 今日复盘</div>
      <div class="dash-card-body" id="reviewBody"><div class="dash-loading">加载中…</div></div>
    </div>

    <div class="dash-card" id="cardAlerts">
      <div class="dash-card-head"><span class="dash-ico">⭐</span> 自选盯盘</div>
      <div class="dash-card-body" id="alertsBody"><div class="dash-loading">加载中…</div></div>
    </div>
  </div>

  <!-- 公告 -->
  <div class="panel dash-notice">
    <div class="panel-title">公告</div>
    <div class="dash-notice-body">
      本站为 A 股量化研究工具，所有内容（每日复盘、AI 选股、信号提醒等）
      <b>仅供研究参考，不构成任何投资建议</b>，据此操作风险自负。
    </div>
  </div>

  <!-- 捷径 -->
  <div class="panel">
    <div class="panel-title">快捷入口</div>
    <div class="dash-shortcuts" id="dashShortcuts"></div>
  </div>
</main>

<!--FOOTER-->

<script src="/static/js/util.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/feedback.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/shell.js"></script>
</body>
</html>
