<main>

  <article class="panel" id="drArticle">
    <!--DR_INIT-->
    <h1 class="panel-title" id="drTitle"><!--DR_TITLE--></h1>
    <div class="md-body" id="drContent"><!--DR_BODY--></div>
  </article>

  <!-- 3. 历史复盘 —— 直出成真链接,爬虫顺着能抓到每一篇往期 -->
  <nav class="panel">
    <div class="panel-title">历史复盘 <span>点击日期查看往期</span></div>
    <div id="drHistoryWrap"><!--DR_HISTORY--></div>
