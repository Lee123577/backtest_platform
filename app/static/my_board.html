<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>%F0%9F%95%90</text></svg>">
  <title>我的数据看板 - 收盘 shoupan</title>
  <meta name="description" content="自由拖拽组合行情走势、多股对比、板块排行、复盘摘要等卡片的个人数据看板，登录后按账号保存布局">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="收盘 shoupan">
  <meta property="og:title" content="我的数据看板 - 收盘 shoupan">
  <meta property="og:description" content="自由拖拽组合行情走势、多股对比、板块排行、复盘摘要等卡片的个人数据看板，登录后按账号保存布局">
  <meta property="og:url" content="https://shoupan.asia/my_board">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://shoupan.asia/my_board">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/feedback.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/my_board.css">
</head>
<body class="spx-shell">

<header>
  <h1>📈 A股量化回测平台</h1>
  <nav class="header-nav">
    <a class="nav-btn" href="/">单股策略</a>
    <a class="nav-btn" href="/daily_review">每日复盘</a>
  </nav>
</header>

<main class="mb-main">
  <div class="mb-hint-row">
    <div class="mb-hint">行情走势、多股对比、板块排行、复盘摘要等卡片自由组合的个人看板（数据来自本站行情库，仅供研究，不构成投资建议）· 卡片可拖动、缩放、增删，布局自动保存；登录后按账号各存一份</div>
    <div class="mb-add-wrap">
      <button type="button" class="mb-add-btn" id="mbAddCard">+ 添加卡片</button>
      <div class="mb-add-pop" id="mbAddPop" hidden></div>
    </div>
    <button type="button" class="mb-reset-btn" id="mbTidyLayout" title="按卡片实际大小自动重新排列，消除重叠和空隙">一键整理</button>
    <button type="button" class="mb-reset-btn" id="mbResetLayout">重置布局</button>
    <!-- 只有管理白名单 IP 会看到（GET /api/my_board/layout 的 can_preview） -->
    <div class="mb-add-wrap" id="mbGuestWrap" hidden>
      <button type="button" class="mb-reset-btn" id="mbGuestBoards" title="查看访客各自存下的看板布局（只读）">访客看板</button>
      <div class="mb-add-pop mb-guest-pop" id="mbGuestPop" hidden></div>
    </div>
  </div>
  <div class="mb-preview-bar" id="mbPreviewBar" hidden>
    <span>正在预览访客 <b id="mbPreviewIp"></b> 的看板 · 只读，任何调整都不会保存</span>
    <button type="button" class="mb-reset-btn" id="mbExitPreview">退出预览</button>
  </div>
  <div class="mb-grid" id="mbGrid"></div>
</main>

<!--FOOTER-->

<script src="/static/js/vendor/echarts.min.js"></script>
<script src="/static/js/util.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/feedback.js"></script>
<script src="/static/js/my_board.js"></script>
<script src="/static/js/shell.js"></script>
</body>
</html>
