<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>因子分析</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    .factors-grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
    @media (max-width: 900px) { .factors-grid { grid-template-columns: 1fr; } }
    .factor-list {
      max-height: 360px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 6px;
    }
    .factor-item {
      padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--bg2);
      transition: background .15s;
    }
    .factor-item:last-child { border-bottom: none; }
    .factor-item:hover { background: var(--bg2); }
    .factor-item.active { background: rgba(9,105,218,.1); border-left: 3px solid var(--accent); padding-left: 9px; }
    .factor-item .name { font-weight: 600; font-size: 13px; color: var(--txt); }
    .factor-item .cat {
      display: inline-block; font-size: 10px; padding: 1px 6px;
      border-radius: 8px; margin-left: 6px; background: var(--bg2); color: var(--txt2);
    }
    .factor-item .desc { font-size: 11px; color: var(--txt2); margin-top: 2px; }

    .summary-cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px; margin-bottom: 14px;
    }
    .stat-card {
      background: var(--bg2); border-radius: 6px; padding: 10px 12px;
      border-left: 3px solid var(--accent);
    }
    .stat-card .label { font-size: 11px; color: var(--txt2); }
    .stat-card .val { font-size: 18px; font-weight: 700; color: var(--txt); margin-top: 2px; }
    .stat-card.good { border-left-color: var(--green); }
    .stat-card.bad  { border-left-color: var(--red); }
    .stat-card.warn { border-left-color: var(--warn); }

    #icChart, #heatmapChart { width: 100%; }
    #icChart { height: 280px; }
    #heatmapChart { height: 320px; }

    .ic-help {
      font-size: 11px; color: var(--txt2); padding: 8px 12px;
      background: var(--bg2); border-radius: 4px; margin-top: 8px;
      line-height: 1.6;
    }
    .ic-help b { color: var(--txt); }

    .toast {
      position: fixed; top: 70px; right: 16px; padding: 10px 16px;
      background: var(--txt); color: #fff; border-radius: 6px;
      font-size: 13px; z-index: 1000; opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 0.92; }
    .toast.error { background: var(--red); }
    .toast.success { background: var(--green); }

    .empty-hint {
      text-align: center; padding: 40px 20px;
      color: var(--txt2); font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <h1>📈 A股量化回测平台</h1>
  <nav class="header-nav">
    <a class="nav-btn" href="/" style="text-decoration:none;display:inline-flex;align-items:center;">单股策略</a>
    <a class="nav-btn" href="/?mode=portfolio" style="text-decoration:none;display:inline-flex;align-items:center;">选股策略</a>
    <button class="nav-btn active">因子分析</button>
    <a class="nav-btn" href="/walk_forward" style="text-decoration:none;display:inline-flex;align-items:center;">参数寻优</a>
    <a class="nav-btn" href="/paper_trading" style="text-decoration:none;display:inline-flex;align-items:center;">实盘观察</a>
    <a class="nav-btn" href="/tasks" style="text-decoration:none;display:inline-flex;align-items:center;">定时任务</a>
  </nav>
</header>

<main>
  <div class="panel">
    <div class="panel-title">因子库 & IC 分析</div>

    <div class="factors-grid">
      <!-- 左：因子列表 -->
      <div>
        <label style="font-size:12px;color:var(--txt2);">选择因子</label>
        <div class="factor-list" id="factorList">
          <div class="empty-hint">加载中…</div>
        </div>
      </div>

      <!-- 右：配置 + 结果 -->
      <div>
        <div class="form-row" style="margin-bottom:12px;">
          <div class="form-group">
            <label>开始日期</label>
            <input type="date" id="startDate" value="2024-01-01">
          </div>
          <div class="form-group">
            <label>结束日期</label>
            <input type="date" id="endDate">
          </div>
          <div class="form-group">
            <label>未来收益期（交易日）</label>
            <input type="number" id="horizon" value="20" min="1" max="120" step="1" style="width:90px">
          </div>
          <div class="form-group">
            <label>相关方法</label>
            <select id="method" style="width:120px">
              <option value="spearman">Spearman</option>
              <option value="pearson">Pearson</option>
            </select>
          </div>
        </div>

        <div class="inline-group" style="margin-bottom:14px;gap:8px;">
          <button class="btn btn-primary" id="analyzeBtn">分析 IC</button>
          <button class="btn btn-outline" id="computeBtn">计算并入库</button>
          <span id="statusText" style="font-size:12px;color:var(--txt2);"></span>
        </div>

        <div id="resultZone" style="display:none;">
          <!-- 汇总卡片 -->
          <div class="summary-cards" id="summaryCards"></div>

          <!-- IC 序列 -->
          <div style="font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--txt);">
            IC 时间序列
          </div>
          <div id="icChart"></div>

          <!-- 月度热图 -->
          <div style="font-size:13px;font-weight:600;margin:18px 0 6px;color:var(--txt);">
            月度 IC 热图
          </div>
          <div id="heatmapChart"></div>

          <div class="ic-help">
            <b>怎么读:</b>
            <b>IC mean</b> 因子方向稳定性，绝对值 &gt; 0.03 算有信号；
            <b>ICIR</b> 信息系数信息比，&gt; 0.5 有用、&gt; 1 强、&gt; 1.5 罕见；
            <b>t-stat</b> &gt; 2 统计显著；
            <b>hit rate</b> IC 方向稳定性。
            月度热图红 = 因子正向预测，蓝 = 反向，颜色越浅越弱。
          </div>
        </div>

        <div id="emptyHint" class="empty-hint">
          选一个因子，配置参数，点【分析 IC】
        </div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/static/js/factors.js"></script>
</body>
</html>
