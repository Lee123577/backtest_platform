<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>%F0%9F%95%90</text></svg>">
  <title>大盘云图 - 收盘 shoupan</title>
  <meta name="description" content="A股大盘云图，按板块/涨跌幅可视化全市场行情，快速看清今日热点与资金动向">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="收盘 shoupan">
  <meta property="og:title" content="大盘云图 - 收盘 shoupan">
  <meta property="og:description" content="A股大盘云图，按板块/涨跌幅可视化全市场行情，快速看清今日热点与资金动向">
  <meta property="og:url" content="https://shoupan.asia/cloudmap">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://shoupan.asia/cloudmap">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/feedback.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/cloudmap.css">
</head>
<body class="spx-shell">

<header>
  <h1>🕐 收盘 shoupan</h1>
  <nav class="header-nav">
    <a class="nav-btn" href="/">单股策略</a>
    <a class="nav-btn" href="/daily_review">每日复盘</a>
  </nav>
</header>

<main>
  <div class="cm-toolbar">
    <div class="cm-toolbar-left">
      <h2 class="cm-title">大盘云图</h2>
      <span class="cm-date" id="cmDate">—</span>
      <span class="cm-date" id="cmCount"></span>
    </div>
    <div class="cm-toolbar-right">
      <select id="minCapFilter" class="cm-select" title="按流通市值下限过滤，避免小盘挤爆云图">
        <option value="0">无市值下限</option>
        <option value="50" selected>市值 ≥ 50 亿</option>
        <option value="100">市值 ≥ 100 亿</option>
        <option value="500">市值 ≥ 500 亿</option>
        <option value="1000">市值 ≥ 1000 亿</option>
      </select>
      <button type="button" class="cm-btn" id="refreshBtn">⟳ 刷新</button>
    </div>
  </div>

  <div class="cm-legend" id="legend"></div>

  <div class="cm-canvas-wrap" id="cmCanvasWrap">
    <canvas id="treemap"></canvas>
    <div class="cm-tooltip" id="cmTooltip" hidden></div>
    <div class="cm-loading" id="loading" hidden>加载中…</div>
    <div class="cm-error" id="error" hidden></div>
  </div>

  <div class="cm-hint">面积代表流通市值，颜色代表当日涨跌幅（绿跌红涨），hover 查看个股详情 · 数据来自本站行情库，仅供研究，不构成投资建议。</div>
</main>

<!--FOOTER-->

<script src="/static/js/util.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/feedback.js"></script>
<script src="/static/js/cloudmap.js"></script>
<script src="/static/js/shell.js"></script>
</body>
</html>
