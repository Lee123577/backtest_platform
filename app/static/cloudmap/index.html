<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大盘云图 · A股量化回测平台</title>
  <link rel="stylesheet" href="/static/css/style.css?v=20260708">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    .cm-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .cm-date-badge {
      background: var(--bg2); padding: 4px 10px; border-radius: 12px;
      font-size: 11px; color: var(--txt2);
    }
    .cm-summary-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px; margin: 10px 0 14px;
    }
    .cm-stat {
      background: var(--bg2); border-radius: 6px; padding: 10px 12px;
      border-left: 3px solid var(--accent);
    }
    .cm-stat.up { border-left-color: #cf222e; }
    .cm-stat.down { border-left-color: #1a7f37; }
    .cm-stat .label { font-size: 11px; color: var(--txt2); }
    .cm-stat .val { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .cm-stat.up .val { color: #cf222e; }
    .cm-stat.down .val { color: #1a7f37; }

    #treemap {
      width: 100%; height: 75vh; min-height: 480px;
      background: #111; border-radius: 6px;
    }
    .cm-legend {
      font-size: 10px; color: var(--txt2); margin-top: 6px;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .cm-legend .swatch {
      display: inline-block; width: 14px; height: 10px; vertical-align: middle;
    }
    .cm-controls { display: flex; align-items: center; gap: 8px; }
    .cm-controls select {
      padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px;
      background: #fff; font-size: 13px; cursor: pointer;
    }
    .cm-controls .btn-refresh {
      padding: 5px 14px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg2); cursor: pointer; font-size: 12px; color: var(--accent);
    }
    .cm-controls .btn-refresh:hover { background: var(--accent); color: #fff; }
    .cm-loading {
      text-align: center; padding: 80px; color: var(--txt2); font-size: 13px;
    }
    .cm-error {
      background: #ffebe9; color: var(--red); padding: 12px;
      border-radius: 6px; font-size: 13px; margin: 12px 0;
    }
  </style>
  <link rel="stylesheet" href="/static/css/feedback.css?v=20260713">
  <link rel="stylesheet" href="/static/css/shell.css?v=20260714">
</head>
<body>

<header>
  <h1>📈 A股量化回测平台</h1>
  <nav class="header-nav">
    <a class="nav-btn" href="/" style="text-decoration:none;display:inline-flex;align-items:center;">单股策略</a>
    <a class="nav-btn" href="/?mode=portfolio" style="text-decoration:none;display:inline-flex;align-items:center;">选股策略</a>
    <button class="nav-btn active">大盘云图</button>
    <a class="nav-btn" href="/paper_trading" style="text-decoration:none;display:inline-flex;align-items:center;">实盘观察</a>
    <a class="nav-btn" href="/ai_hotsector" style="text-decoration:none;display:inline-flex;align-items:center;">AI热门板块</a>
    <a class="nav-btn" href="/daily_review" style="text-decoration:none;display:inline-flex;align-items:center;">每日复盘</a>
    <a class="nav-btn" href="/watchlist" style="text-decoration:none;display:inline-flex;align-items:center;">自选盯盘</a>
    <a class="nav-btn" href="/tasks" style="text-decoration:none;display:inline-flex;align-items:center;">定时任务</a>
  </nav>
</header>

<main>
  <div class="panel">
    <div class="panel-title">
      <div class="cm-head">
        大盘云图
        <span class="cm-date-badge" id="dateBadge">—</span>
        <span style="margin-left:auto;" class="cm-controls">
          <select id="marketFilter">
            <option value="all">全部 A 股</option>
            <option value="SH">仅沪市</option>
            <option value="SZ">仅深市</option>
            <option value="BJ">仅北交所</option>
          </select>
          <select id="categoryFilter">
            <option value="all">全部板块</option>
            <option value="沪市主板">沪市主板</option>
            <option value="深市主板">深市主板</option>
            <option value="科创板">科创板</option>
            <option value="创业板">创业板</option>
            <option value="中小板">中小板</option>
            <option value="北交所">北交所</option>
          </select>
          <select id="minCapFilter">
            <option value="0">无市值下限</option>
            <option value="50" selected>市值 ≥ 50 亿</option>
            <option value="100">市值 ≥ 100 亿</option>
            <option value="500">市值 ≥ 500 亿</option>
            <option value="1000">市值 ≥ 1000 亿</option>
          </select>
          <label style="font-size:11px;color:var(--txt2);display:inline-flex;align-items:center;gap:4px;">
            <input type="checkbox" id="autoRefresh" checked> 自动刷新
          </label>
          <button class="btn-refresh" id="refreshBtn">⟳ 刷新</button>
        </span>
      </div>
    </div>

    <div class="cm-summary-row" id="summaryRow"></div>
    <div id="treemap"></div>
    <div class="cm-legend" id="legend"></div>

    <div style="font-size:11px;color:var(--txt2);margin-top:6px;line-height:1.6;">
      📌 <b>操作提示</b>：
      矩形面积 = 流通市值 ·
      颜色 = 涨跌幅（红涨绿跌） ·
      hover 看个股详情 ·
      点击大类块下钻 ·
      <span id="autoRefreshHint">自动刷新 60 秒</span>
    </div>

    <div id="loading" class="cm-loading" style="display:none;">加载中…</div>
    <div id="error" class="cm-error" style="display:none;"></div>
  </div>
</main>

<footer class="site-footer">
  💡 需要定制策略 / 接入实盘？只提供代码，服务器需自行购买 · 第一单免费（目前限时全免）·

</footer>

<script src="/static/js/cloudmap.js"></script>
<script src="/static/js/feedback.js?v=20260713"></script>
<script src="/static/js/auth.js?v=20260714"></script>
<script src="/static/js/shell.js?v=20260721"></script>
</body>
</html>
